[project]
authors = [{name = "Tyler Erickson", email = "tyler@vorgeo.com"}]
dependencies = []
name = "rle_workshop"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
rle_workshop = { path = ".", editable = true }
# For local development use the editable paths below:
iucn-get-data = { path = "../iucn-get-data", editable = true }
rle-python = { path = "../rle-python", editable = true, extras = ["viz"] }
rle-python-gee = { path = "../rle-python-gee", editable = true }
# For production use:
# iucn-get-data = { git = "https://github.com/RLE-Assessment/iucn-get-data.git" }
# rle-python = { git = "https://github.com/RLE-Assessment/rle-python.git", tag = "v0.2.0", extras = ["viz"] }
# rle-python-gee = { git = "https://github.com/RLE-Assessment/rle-python-gee.git", tag = "v0.2.1" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
quarto = ">=1.8.27,<2"
jupyter = ">=1.1.1,<2"
# Authoring-time dependency for src/translate_notebooks.py (generates the
# Spanish -es.ipynb decks via the Claude API). Not needed to render the site.
anthropic = ">=0.40"
proj = "*"
graphviz = ">=14.1.2,<15"
# rasterio is a transitive dep of rle-python. Pull it from conda-forge (GDAL
# bundled) so pixi never falls back to compiling the PyPI sdist, which needs a
# system GDAL that isn't present. This satisfies the pypi `rasterio>=1.3.0`
# requirement via conda hash-mapping.
rasterio = ">=1.3.0"
itables = ">=2.9.0,<3"
